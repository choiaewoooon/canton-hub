# fly.toml — Canton Hub backend deployment config
#
# This deploys the FastAPI backend only. The telegram bot and the Next.js
# frontend deploy separately (LaunchAgent + Vercel respectively).
#
# Before first deploy:
#   1. `fly auth signup` / `fly auth login`
#   2. `fly launch --no-deploy --name canton-api` (generates initial app)
#      — or just `fly apps create canton-api` and keep this fly.toml
#   3. `fly volumes create canton_data --size 1 --region nrt` (optional cache)
#   4. `fly secrets set \
#         COINGECKO_API_KEY=xxx \
#         RAPIDAPI_KEY=xxx \
#         GITHUB_TOKEN=xxx \
#         ALLOWED_ORIGINS=https://canton-hub.vercel.app`
#   5. `fly deploy`
#
# Region: nrt (Tokyo) — lowest latency from Korea / CantonScan.

app = "canton-api"
primary_region = "nrt"

[build]

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # KEEP AT 1 — scheduler needs to stay alive
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[mounts]]
  source = "canton_data"
  destination = "/app/data"

[[vm]]
  memory_mb = 512    # 256 is too tight with Playwright Chromium
  cpu_kind = "shared"
  cpus = 1
